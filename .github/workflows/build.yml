name: Build executable

on:
  workflow_dispatch:
    inputs:
      enable_notifications:
        description: 'Include GitHub release checks when Wand starts'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup MSBuild and .NET Framework
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Run Build Script
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.enable_notifications }}" -eq "true") {
            .\build.ps1 -Configuration Release -EnableUpdateNotifications
          } else {
            .\build.ps1 -Configuration Release
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Release
          path: WandEnhancer/bin/Release/
